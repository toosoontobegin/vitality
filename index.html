<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Arcade</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1240;--pn:#2b1f66;--pk:#ff4f9a;--yl:#ffd23f;--mt:#3ef2b0;--tx:#fff7e6;--rd:#ff5b5b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:800 16px Nunito,system-ui,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1,h2,.bf{font-family:Bungee,Impact,sans-serif;font-weight:400;margin:.2em 0}
#app{max-width:1100px;margin:0 auto;padding:12px}
#hud{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;background:var(--pn);border:3px solid var(--yl);border-radius:16px;padding:8px 14px;box-shadow:4px 4px 0 #000;margin-bottom:12px;font-family:Bungee,sans-serif}
#hud span{color:var(--yl)}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px;align-items:start}
.lay.one{grid-template-columns:1fr}
.ans{background:var(--pn);border:3px solid var(--mt);border-radius:18px;padding:12px 14px;box-shadow:5px 5px 0 #000;position:sticky;top:8px}
.ans h2{color:var(--mt);font-size:1.1rem}.ans p{margin:.5em 0;font-size:.95rem}.ans b{display:inline-block;min-width:1.6em;color:#1b1240;background:var(--yl);border-radius:8px;text-align:center;margin-right:6px}
@media(max-width:700px){.lay{grid-template-columns:1fr}.ans{position:static}}
.card,.qc{background:var(--pn);border:3px solid #000;border-radius:18px;padding:16px;box-shadow:5px 5px 0 #000;margin-bottom:12px}
.card{max-width:640px;margin:20px auto;text-align:center}
.card h1{font-size:2.2rem;color:var(--pk);text-shadow:3px 3px 0 #000}
.qc{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.qc img{max-width:100%;width:300px;border-radius:12px;border:3px solid #000}
.qc>div{flex:1;min-width:220px}
/* Memperbaiki font teks soal agar menggunakan Nunito dan huruf normal (tidak kapital semua) */
.qc h2{color:var(--mt);font-size:1.1rem;font-family:'Nunito',sans-serif;font-weight:800;margin:.2em 0}
.tag{display:inline-block;background:var(--pk);color:#fff;border:2px solid #000;border-radius:99px;padding:2px 12px;font-family:Bungee,sans-serif;font-size:.8rem}
.hint{color:#cfc4ff;margin:.4em 0 0}
input{font:inherit;padding:10px 14px;border-radius:12px;border:3px solid #000;width:min(100%,320px);margin:8px 0;text-align:center}
.btn{font-family:Bungee,sans-serif;background:var(--yl);color:#1b1240;border:3px solid #000;border-radius:12px;padding:10px 16px;box-shadow:3px 3px 0 #000;cursor:pointer;font-size:1rem}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.btn.go{background:var(--mt);margin-top:10px;width:100%}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
@media(min-width:640px){.opts.six{grid-template-columns:repeat(3,1fr)}}
.opt{background:var(--pn);color:var(--tx);border-color:var(--yl)}
.opt.on{background:var(--pk);color:#fff}
.cv{width:100%;height:auto;display:block;border:3px solid #000;border-radius:16px;background:#000;touch-action:none;box-shadow:4px 4px 0 #000;margin:0 auto}
.tyc{text-align:center}
.money{font-family:Bungee,sans-serif;font-size:2.6rem;color:var(--mt);text-shadow:3px 3px 0 #000}
.bar{height:20px;background:#000;border-radius:99px;border:3px solid #000;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pk),var(--yl))}
#ck{font-size:1.4rem;padding:18px 28px;background:var(--pk);color:#fff;margin:8px 0}
.ups{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.ups .btn{background:var(--pn);color:var(--tx);border-color:var(--mt);text-align:left;font-size:.85rem}
.ups .btn:disabled{border-color:#555}
.modal{position:absolute;inset:0;background:#0d0726f0;border-radius:18px;padding:16px;z-index:5;text-align:center}
#fl{position:fixed;inset:0;display:none;place-items:center;background:#000b;z-index:99;text-align:center}
#fl img{max-width:80vw;max-height:42vh;border-radius:16px;border:4px solid #000;display:block;margin:0 auto 12px}
#fl div{font-family:Bungee,sans-serif;font-size:clamp(1.6rem,6vw,3rem);padding:20px;max-width:90vw}
.oi{display:block;max-width:100%;max-height:90px;border-radius:8px;border:2px solid #000;margin:4px 0}
.bigscore{font-family:Bungee,sans-serif;font-size:3.4rem;color:var(--yl);text-shadow:4px 4px 0 #000}
.tbw{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;width:100%;text-align:left;font-size:.9rem}
td,th{padding:6px 8px;border-bottom:2px solid #000}
.ok{color:var(--mt)}.no{color:var(--rd)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="hud" hidden>
    <div>Q <span id="hq">1</span>/10</div><div>Score <span id="hs">0</span></div><div>Time <span id="ht">5:00</span> <button class="btn" id="mu" style="padding:0 8px;box-shadow:2px 2px 0 #000">🔊</button></div>
  </div>
  <main id="stage"></main>
</div>
<div id="fl"><div></div></div>

<script>
/* =====================  EDIT YOUR QUESTIONS HERE  =====================
   t   : 'bow' (Q1-2) | 'space' (Q3-4) | 'trade' (Q5-6) | 'tycoon' (Q7-10)
   q   : question text
   img : image path like 'img/1.svg' (use null for tycoon / text-only)
   o   : answer options (4 for bow/space/tycoon, 6 for trade). Each is text 'Answer' OR {t:'text',img:'img/a.png'} (img and/or t)
   a   : index of the correct option (0 = first)
   song: (optional) 'audio/q1.mp3' OR a built-in tune: 'tune:arcade' | 'tune:battle' | 'tune:boss' | 'tune:chill' | 'tune:space'. Leave out = default tune for that game.
   imgRight / imgWrong (optional): image shown after a right / wrong answer for THIS question.
                         If left out, the defaults IMG_RIGHT / IMG_WRONG below are used.
======================================================================== */
const ph=t=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220"><rect width="100%" height="100%" fill="#ffd23f"/><text x="50%" y="50%" text-anchor="middle" font-size="30" font-family="sans-serif" fill="#1b1240">${t}</text></svg>`);
const Q=[
 {t:'bow',q:'Pada lingkaran berpusat O, sudut keliling \\(\\angle KLM=52^\\circ\\). Tentukan besar sudut pusat \\(\\angle KOM\\).',img:'img/1.svg',o:['26°','78°','52°','104°'],a:3},
 {t:'bow',q:'Garis AB merupakan diameter lingkaran dengan pusat O. Jika \\(\\angle BOC=60^\\circ\\), tentukan besar \\(\\angle AOC\\).',img:'img/2.svg',o:['30°','90°','150°','120°'],a:3},
 {t:'space',q:'Pada lingkaran berpusat O, OM tegak lurus tali busur AB. Jika \\(\\angle AOM=35^\\circ\\), tentukan besar sudut pusat \\(\\angle AOB\\).',img:'img/3.svg',o:['35°','55°','70°','60°'],a:2},
 {t:'space',q:'Dua lingkaran berpusat P dan Q memiliki jari-jari 4 cm dan 2 cm. Jarak kedua pusatnya 10 cm. Berapakah panjang garis singgung persekutuan dalam kedua lingkaran?',img:'img/4.svg',o:['8 cm','12 cm','14 cm','10 cm'],a:0},
 {t:'trade',q:'Sebuah lingkaran berjari-jari 14 cm memiliki sudut pusat \\(\\angle AOB=90^\\circ\\). Tentukan panjang busur AB.',img:'img/5.svg',o:['22 cm','44 cm','88 cm','11 cm','67 cm','99 cm'],a:0},
 {t:'trade',q:'Sebuah lingkaran berjari-jari 14 cm memiliki juring dengan sudut pusat \\(45^\\circ\\). Tentukan luas juring tersebut. Gunakan \\(\\pi=\\frac{22}{7}\\).',img:'img/6.svg',o:['38,5 cm²','77 cm²','154 cm²','308 cm²','1.232 cm²','616 cm²'],a:1},
 {t:'tycoon',q:'Sebuah taman berbentuk lingkaran memiliki jari-jari 14 m. Sebagian taman dengan sudut pusat \\(90^\\circ\\) akan ditanami bunga. Luas area yang ditanami bunga adalah ....',img:null,o:['154 m²','308 m²','616 m²','77 m²'],a:0},
 {t:'tycoon',q:'Sebuah pizza berdiameter 56 cm dipotong sehingga satu potong memiliki sudut pusat \\(45^\\circ\\). Luas satu potong pizza adalah.... (Gunakan \\(\\pi=\\frac{22}{7}\\)).',img:null,o:['2.464 cm²','154 cm²','308 cm²','154 cm²'],a:2},
 {t:'tycoon',q:'Sebuah kolam berbentuk lingkaran memiliki jari-jari 21 m. Area dengan sudut pusat \\(120^\\circ\\) akan diberi keramik. Luas area tersebut adalah.... (Gunakan \\(\\pi=\\frac{22}{7}\\)).',img:null,o:['231 m²','693 m²','462 m²','1.848 m²'],a:2},
 {t:'tycoon',q:'Sebuah roda berbentuk lingkaran memiliki diameter 56 cm. Titik pada tepi roda menempuh busur dengan sudut pusat \\(225^\\circ\\) untuk setiap putaran yang dilakukan. Jika roda berputar sebanyak 12 kali dengan sudut putaran yang sama, total panjang lintasan titik tersebut adalah.... (Gunakan \\(\\pi=\\frac{22}{7}\\)).',img:null,o:['1.100 cm','1.320 cm','880 cm','1390 cm'],a:1},
];
const IMG_RIGHT=ph('img/RIGHT.jpg'),IMG_WRONG=ph('img/WRONG.jpg');   // default result images, e.g. 'img/right.png'
const PTS=100;                                   // points per correct answer
const LIMIT=Math.min(300,+new URLSearchParams(location.search).get('limit')||300); // seconds per question (hard cap 5 min)
/* ===================================================================== */

const TITLE={bow:'Archery',space:'Space boss',trade:'Candle trader',tycoon:'Tycoon'};
const HINT={bow:'Aim and release. Shoot the letter you trust, then wear the boss down. Your answer delivers the final blow!',
 space:'Slash through invaders and minibosses, grab power-ups (W weapon up to Lv5, R speed, H heart, B bomb), then fly into your answer ship.',
 trade:'Warm up with 5 practice trades (10s each, risky!), then pick a letter and lock in. Right = stake x4.',
 tycoon:'Tap and grow your star. The brighter it shines, the closer you are to a supernova rebirth and the question.'};
const $=s=>document.querySelector(s),st=$('#stage');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const oh=o=>typeof o==='object'?(o.img?`<img class="oi" src="${o.img}" alt="">`:'')+esc(o.t||''):esc(o),ot=o=>typeof o==='object'?(o.t||'(image)'):o;
const TUNES={arcade:{o:'square',s:[0,4,7,12,7,4,9,5],d:190},battle:{o:'sawtooth',s:[0,0,7,0,10,0,8,7],d:140},boss:{o:'square',s:[0,1,0,1,7,6,5,3],d:130},chill:{o:'triangle',s:[0,3,7,10,7,3,5,0],d:300},space:{o:'sine',s:[0,7,12,14,12,7,5,3],d:240}},DEF={bow:'arcade',space:'battle',trade:'chill',tycoon:'space'};
const key=n=>'quizarcade:'+n.trim().toLowerCase();
let S=null,G=null,tm=null,paused=false,locked=false;
const save=()=>{try{localStorage.setItem(key(S.name),JSON.stringify(S))}catch(e){}};
const fmt=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':Math.floor(n);
const pt=(e,c)=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};
const mkCanvas=(box,w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;c.className='cv';box.append(c);return c};
function loop(fn){let on=true,last=performance.now();const f=t=>{if(!on)return;const dt=Math.min(.05,(t-last)/1000);last=t;fn(dt,t/1000);requestAnimationFrame(f)};requestAnimationFrame(f);return()=>{on=false}}
function rr(x,X,Y,w,h,r,fill,stroke){x.beginPath();x.roundRect(X,Y,w,h,r);if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=3;x.stroke()}}
function tx(x,s,X,Y,sz,col,al,mw){x.font=`800 ${sz}px Nunito,sans-serif`;x.fillStyle=col;x.textAlign=al||'center';x.textBaseline='middle';x.fillText(s,X,Y,mw)}

let AC,master,cur=null,mute=false;
const vol=()=>mute?0:.5;
function stopMusic(){if(cur)cur();cur=null}
function music(src,i){stopMusic();
 if(src&&!src.startsWith('tune:')){const a=new Audio(src);a.loop=true;a.volume=vol();a.play().catch(()=>{});cur=()=>a.pause();cur.set=()=>{a.volume=vol()};return}
 const T=TUNES[(src||'tune:arcade').slice(5)]||TUNES.arcade;
 try{AC=AC||new(window.AudioContext||webkitAudioContext)();AC.resume();master=master||AC.createGain();master.connect(AC.destination);master.gain.value=vol()*.25;let n=0;
  const id=setInterval(()=>{const o=AC.createOscillator(),g=AC.createGain(),pat=T.s[n%8]+(Math.floor(n/16)%2?5:0),d=T.d/1000;
   o.type=T.o;o.frequency.value=196*2**(pat/12);g.gain.setValueAtTime(.5,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d*1.1);
   o.connect(g);g.connect(master);o.start();o.stop(AC.currentTime+d*1.2);n++},T.d);
  cur=()=>clearInterval(id);cur.set=()=>{master.gain.value=vol()*.25}}catch(e){}}
function hud(){ $('#hud').hidden=!S; if(!S)return; $('#hq').textContent=S.qi+1;
 $('#hs').textContent=S.pts.reduce((a,b)=>a+(b||0),0);
 const r=Math.max(0,LIMIT-S.used);$('#ht').textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0')}
function stopAll(){clearInterval(tm);if(G)G();G=null}

function intro(){
 stopAll();stopMusic();S=null;hud();
 let last='';try{last=localStorage.getItem('quizarcade:last')||''}catch(e){}
 st.innerHTML=`<div class="card"><h1>Quiz Arcade</h1><p>10 mini-games. Max 5 minutes each. Play your answers!</p>
 <input id="nm" placeholder="Your name" maxlength="30" value="${esc(last)}"><br><button class="btn" id="go">Play / Continue</button>
 <p class="hint">Disconnected? Come back with the same name on the same browser and you will continue where you left off.</p></div>`;
 $('#go').onclick=()=>{const n=$('#nm').value.trim();if(!n)return;let s=null;
  try{localStorage.setItem('quizarcade:last',n);s=JSON.parse(localStorage.getItem(key(n)))}catch(e){}
  S=s||{name:n,qi:0,pts:[],picks:[],used:0,mult:1,tyc:null,done:false};
  S.done?results():startQ(S.qi,!!s)}
}

function startQ(i,resume){
 stopAll();S.qi=i;if(!resume)S.used=0;locked=false;paused=false;const q=Q[i];
 st.innerHTML=`<div class="lay${q.t==='tycoon'?' one':''}"><div><div class="qc">${q.img?`<img src="${q.img}" alt="Question image">`:''}<div><span class="tag">${TITLE[q.t]}</span>
  <h2>${q.t==='tycoon'?'Rebirth round '+(i-5)+'/4':q.q}</h2><p class="hint">${HINT[q.t]}</p></div></div><div id="play" style="position:relative"></div></div>
  ${q.t==='tycoon'?'':`<aside class="ans"><h2>Answers</h2>${q.o.map((o,k)=>`<p><b>${L[k]}</b>${oh(o)}</p>`).join('')}</aside>`}</div>`;
 
 // Memicu MathJax agar merender ulang rumus LaTeX pada teks soal baru
 if (window.MathJax && window.MathJax.typeset) {
     window.MathJax.typeset();
 }

 G=GAMES[q.t]($('#play'),q,i);music(q.song||'tune:'+DEF[q.t],i);
 tm=setInterval(()=>{if(paused||locked)return;S.used++;if(S.used%3===0)save();hud();if(S.used>=LIMIT)done(null,S.qi)},1000);
 hud();save();
}

function done(c,qi){
 if(locked||qi!==S.qi)return;locked=true;
 const q=Q[S.qi],ok=c===q.a;S.picks[S.qi]=c;S.pts[S.qi]=ok?PTS:0;S.tyc=null;
 let extra='';if(q.t==='tycoon'){S.mult*=ok?4:2;extra=`<br><small>Multiplier is now x${S.mult}</small>`}
 save();hud();
 const f=$('#fl');f.style.display='grid';
 const im=ok?(q.imgRight||IMG_RIGHT):(q.imgWrong||IMG_WRONG);
 f.firstElementChild.innerHTML=`<img src="${im}" alt="">`+(c===null?`Time's up!${extra}`:ok?`<span class="ok">Correct! +${PTS}</span>${extra}`:`<span class="no">Nope!</span>${extra}`);
 setTimeout(()=>{f.style.display='none';stopAll();
  if(S.qi>=Q.length-1){S.done=true;save();results()}else startQ(S.qi+1)},2600);
}

function results(){
 stopAll();stopMusic();hud();const tot=S.pts.reduce((a,b)=>a+(b||0),0);
 const rows=Q.map((q,i)=>{const c=S.picks[i],ok=c===q.a;
  return`<tr><td>${i+1}</td><td>${esc(q.q)}</td><td>${c==null?'(no answer)':esc(ot(q.o[c]))}</td><td>${esc(ot(q.o[q.a]))}</td><td class="${ok?'ok':'no'}">${ok?'Right':'Wrong'}</td></tr>`}).join('');
 st.innerHTML=`<div class="card" style="max-width:820px"><h1>Game over!</h1><div class="bigscore">${tot} / ${Q.length*PTS}</div><p>Well played, ${esc(S.name)}!</p>
 <div class="tbw"><table><tr><th>#</th><th>Question</th><th>Your choice</th><th>Correct</th><th></th></tr>${rows}</table></div>
 <button class="btn" id="dl">Download my choices</button> <button class="btn" id="nw" style="background:var(--pk);color:#fff">New player</button></div>`;
 $('#dl').onclick=()=>{const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const L=[['Question','Question text','Your choice','Correct answer','Result','Points'].map(q).join(',')];
  Q.forEach((z,i)=>{const c=S.picks[i];L.push([i+1,z.q,c==null?'(no answer)':ot(z.o[c]),ot(z.o[z.a]),c===z.a?'Right':'Wrong',S.pts[i]||0].map(q).join(','))});
  L.push(['','','','','TOTAL',tot].map(q).join(','));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+L.join('\n')],{type:'text/csv'}));
  a.download='quiz-results-'+S.name.replace(/\W+/g,'_')+'.csv';a.click()};
 $('#nw').onclick=intro;
}

const L='ABCDEF',el=(t,c,x)=>{const e=document.createElement(t);e.className=c||'';if(x)e.textContent=x;return e};
const GAMES={};

/* ---------- Q1-2: archery + boss ---------- */
GAMES.bow=(box,q,qi)=>{
 const N=innerWidth<700,W=N?560:900,H=N?520:480,c=mkCanvas(box,W,H),x=c.getContext('2d');
 const SX=N?70:100,SY=H-85,P=(N?[[470,90],[330,210],[480,330],[340,440]]:[[780,80],[640,190],[800,300],[660,410]]).sort(()=>Math.random()-.5);
 const T=q.o.map((o,i)=>({i,l:L[i],x:P[i][0],y:P[i][1]}));
 let m={x:500,y:200},ar=null,ph='pick',ally=null,fx=[],tt=0,line='',bs={x:W-95,y:H/2,hp:100,gone:0};
 const aim=()=>{const dx=m.x-SX,dy=m.y-SY,p=Math.min(Math.hypot(dx,dy),260)/260;return{a:Math.atan2(dy,dx),v:7+11*p}};
 c.onpointermove=c.onpointerdown=e=>{m=pt(e,c)};
 c.onpointerup=e=>{m=pt(e,c);if(ar||ph==='strike'||ph==='end')return;const{a,v}=aim();ar={x:SX+Math.cos(a)*30,y:SY-5+Math.sin(a)*30,vx:Math.cos(a)*v,vy:Math.sin(a)*v}};
 const boom=(X,Y,n,col)=>{for(let i=0;i<n;i++)fx.push({x:X,y:Y,vx:(Math.random()-.5)*420,vy:(Math.random()-.5)*420,l:1,c:col})};
 return loop((dt,t)=>{const k=dt*60;tt+=dt;
  if(ph!=='end')bs.y=H/2+Math.sin(t*1.3)*(H/2-120);
  if(ar){ar.x+=ar.vx*k;ar.y+=ar.vy*k;ar.vy+=.22*k;
   if(ph==='pick'){const h=T.find(h=>Math.abs(ar.x-h.x)<36&&Math.abs(ar.y-h.y)<32);if(h){ally={i:h.i,l:h.l};ph='boss';boom(h.x,h.y,30,'#ffd23f');ar=null}}
   else if(ph==='boss'&&Math.hypot(ar.x-bs.x,ar.y-bs.y)<64){bs.hp=Math.max(15,bs.hp-9);boom(ar.x,ar.y,10,'#ff4f9a');ar=null;if(bs.hp<=15){ph='strike';tt=0}}
   if(ar&&(ar.x>W+30||ar.x<-20||ar.y>H-25))ar=null}
  if(ph==='strike'&&tt>1.1){ph='end';if(ally.i===q.a){bs.gone=1;boom(bs.x,bs.y,160,'#c9a0ff')}else line='HAHAHAHA!';setTimeout(()=>done(ally.i,qi),2500)}
  fx.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.l-=dt*(bs.gone?.35:1.2)});fx=fx.filter(f=>f.l>0);
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5b3df0');g.addColorStop(1,'#ff9ed0');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='#3ef2b0';x.fillRect(0,H-25,W,25);

 const btn=U.map((u,i)=>{const b=el('button','btn');b.onclick=()=>{const c=cost(i);if(s.m>=c){s.m-=c;s.g[i]++}};ups.append(b);return b});

  const md=el('div','modal');md.innerHTML=`<span class="tag">Rebirth question</span><h2>${esc(q.q)}</h2><p class="hint">Right = x4 multiplier. Wrong = x2.</p><div class="opts"></div>`;
  q.o.forEach((o,i)=>{const b=el('button','btn opt');b.innerHTML=L[i]+'. '+oh(o);b.onclick=()=>{paused=false;done(i,qi)};md.lastChild.append(b)});box.append(md)};
 return loop((dt,t)=>{if(!locked&&!paused)s.m+=rate()*dt;pulse*=.9;
  const pr=Math.min(1,s.m/GOAL),n=s.g.reduce((a,b)=>a+b,0),R=16+70*pr+pulse*8,hue=8+pr*210;
  x.fillStyle='#07041a';x.fillRect(0,0,600,300);
  bg.forEach(b=>{x.globalAlpha=.2+.6*Math.abs(Math.sin(t*b.p/2+b.p))*(.3+pr);x.fillStyle='#fff';x.fillRect(b.x,b.y,b.r,b.r)});x.globalAlpha=1;
  const g=x.createRadialGradient(300,150,0,300,150,R*3.4);g.addColorStop(0,`hsla(${hue},100%,${60+25*pr}%,${.4+.6*pr})`);g.addColorStop(.35,`hsla(${hue},100%,55%,${.15+.35*pr})`);g.addColorStop(1,'hsla(0,0%,0%,0)');x.fillStyle=g;x.fillRect(0,0,600,300);
  const rays=8+Math.floor(pr*10);x.strokeStyle=`hsla(${hue},100%,80%,${.15+.4*pr})`;x.lineWidth=2;
  for(let i=0;i<rays;i++){const a=t*.2+i*6.283/rays,l=R*(1.5+.5*Math.sin(t*2+i));x.beginPath();x.moveTo(300+Math.cos(a)*R,150+Math.sin(a)*R);x.lineTo(300+Math.cos(a)*l*1.6,150+Math.sin(a)*l*1.6);x.stroke()}
  x.fillStyle=`hsl(${hue},100%,${68+27*pr}%)`;x.beginPath();x.arc(300,150,R,0,7);x.fill();x.fillStyle=`rgba(255,255,255,${.3+.7*pr})`;x.beginPath();x.arc(300,150,R*.55,0,7);x.fill();
  for(let i=0;i<Math.min(n,40);i++){const r=Math.floor(i/10),a=t*(.7-r*.12)+i*.63,rad=R+34+r*20;x.fillStyle=['#3ef2b0','#ffd23f','#ff4f9a','#4fc3ff'][r];x.beginPath();x.arc(300+Math.cos(a)*rad,150+Math.sin(a)*rad*.45,3+r,0,7);x.fill()}
  fx.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.l-=dt*1.6;x.globalAlpha=Math.max(0,f.l);x.fillStyle='#ffd23f';x.fillRect(f.x,f.y,4,4)});x.globalAlpha=1;fx=fx.filter(f=>f.l>0);
  tx(x,`Brightness ${Math.round(pr*100)}%`,16,22,18,'#ffd23f','left');
  info.textContent=`Starlight ${fmt(s.m)} / ${fmt(GOAL)}  \u2022  +${fmt(rate())}/sec  \u2022  x${S.mult}`;
  ck.textContent=`Tap the star! +${fmt(S.mult)}`;pb.style.width=Math.min(100,pr*100)+'%';
  U.forEach((u,i)=>{const c=cost(i);btn[i].disabled=s.m<c;btn[i].textContent=`${u.n} (${s.g[i]}) \u2014 ${fmt(c)} \u2022 +${fmt(u.r*S.mult)}/s`});
  rb.hidden=s.m<GOAL});
};

$('#mu').onclick=()=>{mute=!mute;$('#mu').textContent=mute?'\U0001F507':'\U0001F50A';if(cur&&cur.set)cur.set()};
addEventListener('DOMContentLoaded',intro);
if(document.readyState!=='loading')intro();
