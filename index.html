<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz</title>
<style>
:root{
  --bg:#fffaf0;--surface:#fff;--ink:#241915;--muted:#7a6a5f;--line:#efe3cc;--accent:#c8102e;--accent-ink:#fff;--gold:#d4a017;--sel:#fff3d6;--shadow:0 8px 30px rgba(120,80,10,.10);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0c0c0c;--surface:#181513;--ink:#f7efdd;--muted:#a69a86;--line:#2e2820;--accent:#e0283f;--accent-ink:#fff;--gold:#f0bf3a;--sel:#2a2112;--shadow:0 8px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
.wrap{max-width:760px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
header b{font-weight:600;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.btn{padding:13px 26px;border-radius:999px;font-weight:600;background:var(--accent);color:var(--accent-ink);transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn[disabled]{opacity:.35;pointer-events:none}
h1{font-size:clamp(2rem,6vw,3.1rem);line-height:1.1;letter-spacing:-.03em;font-weight:650}
.sub{color:var(--muted);margin:14px 0 32px;max-width:46ch}
input[type=text]{width:100%;padding:15px 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;margin-bottom:16px}
.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s}
.count{color:var(--muted);font-size:.875rem;margin-bottom:28px}
.q{font-size:clamp(1.35rem,4vw,1.9rem);line-height:1.3;letter-spacing:-.02em;font-weight:600;margin-bottom:22px}
.qimg{display:block;max-width:100%;max-height:300px;border-radius:16px;border:1px solid var(--line);margin-bottom:24px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:32px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--muted)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--muted)}
.opt img{max-width:100%;max-height:110px;border-radius:10px;display:block}
.opt.on{border-color:var(--accent);background:var(--sel)}
.opt.on .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nav{display:flex;justify-content:space-between;gap:12px}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:28px}
.dots button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);font-size:.7rem;color:var(--muted)}
.dots button.done{background:var(--sel);color:var(--ink);border-color:var(--accent)}
.dots button.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.score{font-size:clamp(4rem,16vw,7rem);font-weight:650;letter-spacing:-.05em;line-height:1}
.score small{font-size:.3em;color:var(--muted);font-weight:500;letter-spacing:0}
.row{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0}
.note{color:var(--muted);font-size:.875rem;max-width:52ch}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.85rem;color:var(--muted);margin-top:8px}
.hide{display:none!important}

body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(80px);opacity:.28;pointer-events:none;animation:float 14s ease-in-out infinite alternate}
body::before{width:420px;height:420px;background:var(--gold);top:-120px;right:-100px}
body::after{width:360px;height:360px;background:var(--accent);bottom:-120px;left:-100px;animation-delay:-7s}
:root[data-theme="dark"] body::before,:root[data-theme="dark"] body::after{opacity:.2}
@keyframes float{to{transform:translate(30px,40px) scale(1.1)}}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{50%{transform:scale(1.03)}}
header b{display:flex;align-items:center;gap:10px}
header b::before{content:"";width:14px;height:14px;background:linear-gradient(135deg,var(--gold),var(--accent));transform:rotate(45deg);border-radius:3px}
.icon{box-shadow:var(--shadow);transition:transform .3s}
.icon:hover{transform:rotate(180deg)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:clamp(24px,5vw,44px);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--gold),var(--accent))}
h1::after{content:"";display:block;width:64px;height:4px;border-radius:4px;background:var(--gold);margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chips span{padding:6px 14px;border-radius:999px;background:var(--sel);border:1px solid var(--gold);font-size:.85rem;font-weight:600}
.btn{box-shadow:0 6px 18px rgba(200,16,46,.28)}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{box-shadow:none}
.btn.ghost:hover{border-color:var(--gold)}
input[type=text]:focus{border-color:var(--gold);outline:0;box-shadow:0 0 0 4px rgba(212,160,23,.2)}
.bar{height:8px}
.bar i{background:linear-gradient(90deg,var(--gold),var(--accent))}
.count{display:flex;justify-content:space-between}
.count b{color:var(--gold)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:clamp(18px,4vw,32px);box-shadow:var(--shadow);margin-bottom:22px}
#qbox>*{animation:in .4s both}
.card .opts{margin-bottom:0}
.opt{animation:in .4s both;animation-delay:calc(var(--i,0)*45ms);box-shadow:0 2px 8px rgba(120,80,10,.05)}
.opt:hover{border-color:var(--gold);transform:translateY(-2px)}
.opt:hover .k{border-color:var(--gold);color:var(--gold)}
.opt.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,160,23,.25);animation:pop .3s}
.opt.on .k{background:var(--accent);border-color:var(--accent);color:#fff}
.dots button{transition:transform .15s}
.dots button:hover{transform:scale(1.15);border-color:var(--gold)}
.dots button.done{background:var(--gold);border-color:var(--gold);color:#241915}
.dots button.cur{background:var(--accent);border-color:var(--accent)}
.res{text-align:center}
.score{background:linear-gradient(135deg,var(--gold),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.score small{-webkit-text-fill-color:var(--muted)}
.msg{font-size:1.4rem;font-weight:650;margin-top:12px}
.res .row{justify-content:center}.res .note{margin:0 auto}
.hint{color:var(--muted);font-size:.8rem;text-align:center;margin-top:18px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media(max-width:560px){.hint{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header><b id="brand"></b><button class="icon" id="theme" aria-label="Toggle dark mode">◐</button></header>

  <section id="start" class="hero">
    <h1 id="title"></h1>
    <p class="sub" id="intro"></p>
    <div class="chips"><span>20 questions</span><span>6 options each</span><span>1 attempt</span></div>
    <input type="text" id="name" placeholder="Your full name" maxlength="60" autocomplete="name">
    <button class="btn" id="go">Start quiz</button>
  </section>

  <section id="quiz" class="hide">
    <div class="bar"><i id="bar"></i></div>
    <div class="count" id="count"></div>
    <div class="card"><div id="qbox"></div></div>
    <div class="dots" id="dots"></div>
    <div class="nav">
      <button class="btn ghost" id="prev">Back</button>
      <button class="btn" id="next">Next</button>
    </div>
  </section>

  <section id="result" class="hide res">
    <p class="note" id="who"></p>
    <div class="score" id="score"></div>
    <div class="msg" id="msg"></div>
    <div class="row">
      <button class="btn" id="dl">Download result</button>
    </div>
    <p class="note">Send the downloaded file to your teacher. Your attempt is locked on this device, so reopening this page will show this result again.</p>
    <p class="code" id="code"></p>
  </section>
  <canvas id="fx"></canvas>
  <p class="hint" id="hint">Tip: press A–F to answer, ← → to move</p>
</div>

<script>
/* ============ 1. SETTINGS (edit me) ============ */
const CONFIG = {
  brand: "Class Quiz",
  title: "Quiz title",
  intro: "20 questions, one correct answer each. Your progress saves automatically, even if your connection drops.",
  quizId: "quiz-v1",          // change this to open a fresh attempt for everyone (e.g. a new quiz)
  secret: "change-this-secret" // used for the result's verification code
};

/* ============ 2. QUESTIONS (edit me) ============
   Each question:
     q:       question text
     img:     image URL for the question ("" for none)
     options: 6 items, each { t: "text", img: "image URL or empty" }
     answer:  index of the correct option, 0 = A, 1 = B ... 5 = F
   Put your images in an "img" folder next to this file, e.g. "img/q1.jpg".
   Anyone can read this file in the browser, so answers are visible to a determined student. */
const ph = (label, w = 600, h = 300) => "data:image/svg+xml," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="#c9ccd6"/><text x="50%" y="50%" fill="#555a6b" font-family="sans-serif" font-size="22" text-anchor="middle" dominant-baseline="middle">${label}</text></svg>`);
const L = "ABCDEF";
const QUESTIONS = Array.from({length: 20}, (_, i) => ({
  q: `Question ${i + 1} text goes here`,
  img: "",
  options: L.split("").map(c => ({t: `Answer option ${c}`, img: ""})),
  answer: 0
}));
// Example: question 2 has an image
QUESTIONS[1].img = ph("Question image placeholder");
// Example: question 3 has image answers
QUESTIONS[2].options = L.split("").map(c => ({t: "", img: ph(`Option ${c}`, 300, 160)}));
// Example of editing one question:
// QUESTIONS[0] = { q: "What is 2 + 2?", img: "", answer: 1,
//   options: [{t:"3",img:""},{t:"4",img:""},{t:"5",img:""},{t:"6",img:""},{t:"7",img:""},{t:"8",img:""}] };

/* ============ 3. APP (no need to edit) ============ */
const $ = id => document.getElementById(id);
const KEY = "quiz:" + CONFIG.quizId;
let S = null;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } };

// theme
const root = document.documentElement;
const savedTheme = (() => { try { return localStorage.getItem("quiz:theme"); } catch (e) { return null; } })();
root.dataset.theme = savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
$("theme").onclick = () => {
  root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem("quiz:theme", root.dataset.theme); } catch (e) {}
};

document.title = CONFIG.title;
$("brand").textContent = CONFIG.brand;
$("title").textContent = CONFIG.title;
$("intro").textContent = CONFIG.intro;

const show = id => ["start", "quiz", "result"].forEach(s => $(s).classList.toggle("hide", s !== id));

function hash(str) { // small non-cryptographic checksum, to make edited result files detectable
  let a = 0xdeadbeef, b = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); a = Math.imul(a ^ c, 2654435761); b = Math.imul(b ^ c, 1597334677); }
  a = Math.imul(a ^ (a >>> 16), 2246822507) ^ Math.imul(b ^ (b >>> 13), 3266489909);
  b = Math.imul(b ^ (b >>> 16), 2246822507) ^ Math.imul(a ^ (a >>> 13), 3266489909);
  return (4294967296 * (2097151 & b) + (a >>> 0)).toString(16).toUpperCase().padStart(14, "0");
}
const letters = a => a.map(v => v == null ? "-" : L[v]).join("");
const score = () => S.answers.reduce((n, v, i) => n + (v === QUESTIONS[i].answer ? 1 : 0), 0);
const sig = () => hash([S.name, letters(S.answers), S.finishedAt, CONFIG.secret].join("|"));

function render() {
  const i = S.cur, q = QUESTIONS[i], n = QUESTIONS.length;
  $("bar").style.width = ((i + 1) / n * 100) + "%";
  $("count").innerHTML = `<span>Question ${i + 1} of ${n}</span><b>${S.answers.filter(v => v != null).length} answered</b>`;
  const box = $("qbox"); box.innerHTML = "";
  const h = document.createElement("h2"); h.className = "q"; h.textContent = q.q; box.appendChild(h);
  if (q.img) { const im = document.createElement("img"); im.className = "qimg"; im.src = q.img; im.alt = ""; box.appendChild(im); }
  const g = document.createElement("div"); g.className = "opts"; g.setAttribute("role", "radiogroup");
  q.options.forEach((o, k) => {
    const b = document.createElement("button");
    b.style.setProperty("--i", k);
    b.className = "opt" + (S.answers[i] === k ? " on" : "");
    b.setAttribute("role", "radio"); b.setAttribute("aria-checked", S.answers[i] === k);
    const key = document.createElement("span"); key.className = "k"; key.textContent = L[k]; b.appendChild(key);
    if (o.img) { const im = document.createElement("img"); im.src = o.img; im.alt = o.t || "Option " + L[k]; b.appendChild(im); }
    if (o.t) { const t = document.createElement("span"); t.textContent = o.t; b.appendChild(t); }
    b.onclick = () => { S.answers[i] = k; save(); render(); };
    g.appendChild(b);
  });
  box.appendChild(g);
  const d = $("dots"); d.innerHTML = "";
  QUESTIONS.forEach((_, k) => {
    const b = document.createElement("button");
    b.textContent = k + 1; b.setAttribute("aria-label", "Go to question " + (k + 1));
    b.className = k === i ? "cur" : S.answers[k] != null ? "done" : "";
    b.onclick = () => { S.cur = k; save(); render(); };
    d.appendChild(b);
  });
  $("prev").disabled = i === 0;
  $("next").textContent = i === n - 1 ? "Finish" : "Next";
  scrollTo({top: 0});
}

function finish() {
  const blank = S.answers.filter(v => v == null).length;
  if (blank && !confirm(`You have ${blank} unanswered question${blank > 1 ? "s" : ""}. Finish anyway? You can’t retake the quiz.`)) return;
  if (!blank && !confirm("Submit your answers? You can’t retake the quiz.")) return;
  S.finished = true; S.finishedAt = new Date().toISOString(); save(); showResult();
}

function showResult() {
  show("result");
  $("who").textContent = S.name;
  const sc = score(), tot = QUESTIONS.length, pct = sc / tot;
  $("msg").textContent = pct >= .9 ? "Outstanding!" : pct >= .7 ? "Great work!" : pct >= .5 ? "Solid effort!" : "Good try, keep practicing!";
  $("hint").classList.add("hide");
  let n = 0; const tick = () => { $("score").innerHTML = `${n}<small> / ${tot}</small>`; if (n++ < sc) setTimeout(tick, 70); };
  tick();
  if (pct >= .5 && !matchMedia("(prefers-reduced-motion: reduce)").matches) confetti();
  $("code").textContent = "Verification code " + sig();
}

function confetti() {
  const c = $("fx"), x = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  const cols = ["#f0bf3a", "#d4a017", "#e0283f", "#ffffff"];
  const p = Array.from({length: 130}, () => ({x: Math.random() * c.width, y: -20 - Math.random() * c.height * .6, w: 6 + Math.random() * 6, h: 4 + Math.random() * 6,
    vx: Math.random() * 2 - 1, vy: 2 + Math.random() * 3, r: Math.random() * 6, vr: Math.random() * .2 - .1, c: cols[Math.random() * cols.length | 0]}));
  let f = 0;
  (function t() {
    x.clearRect(0, 0, c.width, c.height);
    p.forEach(o => { o.x += o.vx; o.y += o.vy; o.r += o.vr; x.save(); x.translate(o.x, o.y); x.rotate(o.r); x.fillStyle = o.c; x.fillRect(-o.w / 2, -o.h / 2, o.w, o.h); x.restore(); });
    if (++f < 280) requestAnimationFrame(t); else x.clearRect(0, 0, c.width, c.height);
  })();
}

function download() {
  const lines = [
    CONFIG.title, "=".repeat(CONFIG.title.length), "",
    "Name:      " + S.name,
    "Submitted: " + S.finishedAt,
    "Score:     " + score() + " / " + QUESTIONS.length, "",
    "Answers (A-F, - = blank):"
  ];
  S.answers.forEach((v, i) => lines.push(`  ${String(i + 1).padStart(2, " ")}. ${v == null ? "-" : L[v]}  ${v === QUESTIONS[i].answer ? "correct" : "wrong"}`));
  lines.push("", "Answer string: " + letters(S.answers), "Verification code: " + sig());
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\n")], {type: "text/plain"}));
  a.download = "quiz-result-" + S.name.trim().replace(/\W+/g, "-").toLowerCase() + ".txt";
  document.body.appendChild(a); a.click(); a.remove();
}

$("go").onclick = () => {
  $("hint").classList.remove("hide");
  const name = $("name").value.trim();
  if (!name) { $("name").focus(); return; }
  S = {name, cur: 0, answers: Array(QUESTIONS.length).fill(null), finished: false, startedAt: new Date().toISOString()};
  save(); show("quiz"); render();
};
$("prev").onclick = () => { if (S.cur > 0) { S.cur--; save(); render(); } };
$("next").onclick = () => { if (S.cur < QUESTIONS.length - 1) { S.cur++; save(); render(); } else finish(); };
$("dl").onclick = download;

document.addEventListener("keydown", e => {
  if (!S || S.finished || $("quiz").classList.contains("hide") || e.target.tagName === "INPUT") return;
  const k = L.indexOf(e.key.toUpperCase());
  if (e.key.length === 1 && k > -1) { S.answers[S.cur] = k; save(); render(); }
  else if (e.key === "ArrowRight" && S.cur < QUESTIONS.length - 1) $("next").click();
  else if (e.key === "ArrowLeft" && S.cur > 0) $("prev").click();
});

S = load();
if (S && S.finished) showResult();
else if (S) { show("quiz"); render(); }
else show("start");
$("hint").classList.toggle("hide", !S || S.finished || false);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
