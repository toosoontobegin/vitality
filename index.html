<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1240;--pn:#2b1f66;--pk:#ff4f9a;--yl:#ffd23f;--mt:#3ef2b0;--tx:#fff7e6;--rd:#ff5b5b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:800 16px Nunito,system-ui,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1,h2,.bf{font-family:Bungee,Impact,sans-serif;font-weight:400;margin:.2em 0}
#app{max-width:960px;margin:0 auto;padding:12px}
#hud{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;background:var(--pn);border:3px solid var(--yl);border-radius:16px;padding:8px 14px;box-shadow:4px 4px 0 #000;margin-bottom:12px;font-family:Bungee,sans-serif}
#hud span{color:var(--yl)}
.card,.qc{background:var(--pn);border:3px solid #000;border-radius:18px;padding:16px;box-shadow:5px 5px 0 #000;margin-bottom:12px}
.card{max-width:640px;margin:20px auto;text-align:center}
.card h1{font-size:2.2rem;color:var(--pk);text-shadow:3px 3px 0 #000}
.qc{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.qc img{max-width:100%;width:300px;border-radius:12px;border:3px solid #000}
.qc>div{flex:1;min-width:220px}
.tag{display:inline-block;background:var(--pk);color:#fff;border:2px solid #000;border-radius:99px;padding:2px 12px;font-family:Bungee,sans-serif;font-size:.8rem}
.hint{color:#cfc4ff;margin:.4em 0 0}
input{font:inherit;padding:10px 14px;border-radius:12px;border:3px solid #000;width:min(100%,320px);margin:8px 0;text-align:center}
.btn{font-family:Bungee,sans-serif;background:var(--yl);color:#1b1240;border:3px solid #000;border-radius:12px;padding:10px 16px;box-shadow:3px 3px 0 #000;cursor:pointer;font-size:1rem}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.btn.go{background:var(--mt);margin-top:10px;width:100%}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
@media(min-width:640px){.opts.six{grid-template-columns:repeat(3,1fr)}}
.opt{background:var(--pn);color:var(--tx);border-color:var(--yl)}
.opt.on{background:var(--pk);color:#fff}
.cv{width:100%;height:auto;display:block;border:3px solid #000;border-radius:16px;background:#000;touch-action:none;box-shadow:4px 4px 0 #000;margin:0 auto}
.tyc{text-align:center}
.money{font-family:Bungee,sans-serif;font-size:2.6rem;color:var(--mt);text-shadow:3px 3px 0 #000}
.bar{height:20px;background:#000;border-radius:99px;border:3px solid #000;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pk),var(--yl))}
#ck{font-size:1.4rem;padding:18px 28px;background:var(--pk);color:#fff;margin:8px 0}
.ups{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.ups .btn{background:var(--pn);color:var(--tx);border-color:var(--mt);text-align:left;font-size:.85rem}
.ups .btn:disabled{border-color:#555}
.modal{position:absolute;inset:0;background:#0d0726f0;border-radius:18px;padding:16px;z-index:5;text-align:center}
#fl{position:fixed;inset:0;display:none;place-items:center;background:#000b;z-index:99;text-align:center}
#fl img{max-width:80vw;max-height:42vh;border-radius:16px;border:4px solid #000;display:block;margin:0 auto 12px}
#fl div{font-family:Bungee,sans-serif;font-size:clamp(1.6rem,6vw,3rem);padding:20px;max-width:90vw}
.bigscore{font-family:Bungee,sans-serif;font-size:3.4rem;color:var(--yl);text-shadow:4px 4px 0 #000}
.tbw{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;width:100%;text-align:left;font-size:.9rem}
td,th{padding:6px 8px;border-bottom:2px solid #000}
.ok{color:var(--mt)}.no{color:var(--rd)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="hud" hidden>
    <div>Q <span id="hq">1</span>/10</div><div>Score <span id="hs">0</span></div><div>Time <span id="ht">5:00</span></div>
  </div>
  <main id="stage"></main>
</div>
<div id="fl"><div></div></div>

<script>
/* =====================  EDIT YOUR QUESTIONS HERE  =====================
   t   : 'bow' (Q1-2) | 'space' (Q3-4) | 'trade' (Q5-6) | 'tycoon' (Q7-10)
   q   : question text
   img : image path like 'img/q1.png' (use null for tycoon / text-only)
   o   : answer options (4 for bow/space/tycoon, 6 for trade)
   a   : index of the correct option (0 = first)
   imgRight / imgWrong (optional): image shown after a right / wrong answer for THIS question.
                         If left out, the defaults IMG_RIGHT / IMG_WRONG below are used.
======================================================================== */
const ph=t=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220"><rect width="100%" height="100%" fill="#ffd23f"/><text x="50%" y="50%" text-anchor="middle" font-size="30" font-family="sans-serif" fill="#1b1240">${t}</text></svg>`);
const Q=[
 {t:'bow',q:'Placeholder question 1',img:ph('IMAGE 1'),o:['Answer A','Answer B','Answer C','Answer D'],a:0},
 {t:'bow',q:'Placeholder question 2',img:ph('IMAGE 2'),o:['Answer A','Answer B','Answer C','Answer D'],a:2},
 {t:'space',q:'Placeholder question 3',img:ph('IMAGE 3'),o:['Answer A','Answer B','Answer C','Answer D'],a:1},
 {t:'space',q:'Placeholder question 4',img:ph('IMAGE 4'),o:['Answer A','Answer B','Answer C','Answer D'],a:3},
 {t:'trade',q:'Placeholder question 5',img:ph('IMAGE 5'),o:['Answer A','Answer B','Answer C','Answer D','Answer E','Answer F'],a:4},
 {t:'trade',q:'Placeholder question 6',img:ph('IMAGE 6'),o:['Answer A','Answer B','Answer C','Answer D','Answer E','Answer F'],a:1},
 {t:'tycoon',q:'Placeholder question 7',img:null,o:['Answer A','Answer B','Answer C','Answer D'],a:0},
 {t:'tycoon',q:'Placeholder question 8',img:null,o:['Answer A','Answer B','Answer C','Answer D'],a:3},
 {t:'tycoon',q:'Placeholder question 9',img:null,o:['Answer A','Answer B','Answer C','Answer D'],a:2},
 {t:'tycoon',q:'Placeholder question 10',img:null,o:['Answer A','Answer B','Answer C','Answer D'],a:1},
];
const IMG_RIGHT=ph('RIGHT!'),IMG_WRONG=ph('WRONG!');   // default result images, e.g. 'img/right.png'
const PTS=100;                                   // points per correct answer
const LIMIT=Math.min(300,+new URLSearchParams(location.search).get('limit')||300); // seconds per question (hard cap 5 min)
/* ===================================================================== */

const TITLE={bow:'Archery',space:'Space boss',trade:'Candle trader',tycoon:'Tycoon'};
const HINT={bow:'Move to aim, release to shoot. Hit the right answer!',
 space:'Blast 10 invaders, then fly into the answer ship you trust. It fights the boss for you.',
 trade:'Pick a coin, then lock in. Right = stake x4. Wrong = crash.',
 tycoon:'Earn the goal, then rebirth and answer. Right = x4 multiplier, wrong = x2.'};
const $=s=>document.querySelector(s),st=$('#stage');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key=n=>'quizarcade:'+n.trim().toLowerCase();
let S=null,G=null,tm=null,paused=false,locked=false;
const save=()=>{try{localStorage.setItem(key(S.name),JSON.stringify(S))}catch(e){}};
const fmt=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':Math.floor(n);
const pt=(e,c)=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};
const mkCanvas=(box,w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;c.className='cv';box.append(c);return c};
function loop(fn){let on=true,last=performance.now();const f=t=>{if(!on)return;const dt=Math.min(.05,(t-last)/1000);last=t;fn(dt,t/1000);requestAnimationFrame(f)};requestAnimationFrame(f);return()=>{on=false}}
function rr(x,X,Y,w,h,r,fill,stroke){x.beginPath();x.roundRect(X,Y,w,h,r);if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=3;x.stroke()}}
function tx(x,s,X,Y,sz,col,al,mw){x.font=`800 ${sz}px Nunito,sans-serif`;x.fillStyle=col;x.textAlign=al||'center';x.textBaseline='middle';x.fillText(s,X,Y,mw)}

function hud(){ $('#hud').hidden=!S; if(!S)return; $('#hq').textContent=S.qi+1;
 $('#hs').textContent=S.pts.reduce((a,b)=>a+(b||0),0);
 const r=Math.max(0,LIMIT-S.used);$('#ht').textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0')}
function stopAll(){clearInterval(tm);if(G)G();G=null}

function intro(){
 stopAll();S=null;hud();
 let last='';try{last=localStorage.getItem('quizarcade:last')||''}catch(e){}
 st.innerHTML=`<div class="card"><h1>Quiz Arcade</h1><p>10 mini-games. Max 5 minutes each. Play your answers!</p>
 <input id="nm" placeholder="Your name" maxlength="30" value="${esc(last)}"><br><button class="btn" id="go">Play / Continue</button>
 <p class="hint">Disconnected? Come back with the same name on the same browser and you will continue where you left off.</p></div>`;
 $('#go').onclick=()=>{const n=$('#nm').value.trim();if(!n)return;let s=null;
  try{localStorage.setItem('quizarcade:last',n);s=JSON.parse(localStorage.getItem(key(n)))}catch(e){}
  S=s||{name:n,qi:0,pts:[],picks:[],used:0,mult:1,tyc:null,done:false};
  S.done?results():startQ(S.qi,!!s)}
}

function startQ(i,resume){
 stopAll();S.qi=i;if(!resume)S.used=0;locked=false;paused=false;const q=Q[i];
 st.innerHTML=`<div class="qc">${q.img?`<img src="${q.img}" alt="Question image">`:''}<div><span class="tag">${TITLE[q.t]}</span>
  <h2>${q.t==='tycoon'?'Rebirth round '+(i-5)+'/4':esc(q.q)}</h2><p class="hint">${HINT[q.t]}</p></div></div><div id="play" style="position:relative"></div>`;
 G=GAMES[q.t]($('#play'),q,i);
 tm=setInterval(()=>{if(paused||locked)return;S.used++;if(S.used%3===0)save();hud();if(S.used>=LIMIT)done(null,S.qi)},1000);
 hud();save();
}

function done(c,qi){
 if(locked||qi!==S.qi)return;locked=true;
 const q=Q[S.qi],ok=c===q.a;S.picks[S.qi]=c;S.pts[S.qi]=ok?PTS:0;S.tyc=null;
 let extra='';if(q.t==='tycoon'){S.mult*=ok?4:2;extra=`<br><small>Multiplier is now x${S.mult}</small>`}
 save();hud();
 const f=$('#fl');f.style.display='grid';
 const im=ok?(q.imgRight||IMG_RIGHT):(q.imgWrong||IMG_WRONG);
 f.firstElementChild.innerHTML=`<img src="${im}" alt="">`+(c===null?`Time's up!${extra}`:ok?`<span class="ok">Correct! +${PTS}</span>${extra}`:`<span class="no">Nope!</span>${extra}`);
 setTimeout(()=>{f.style.display='none';stopAll();
  if(S.qi>=Q.length-1){S.done=true;save();results()}else startQ(S.qi+1)},2600);
}

function results(){
 stopAll();hud();const tot=S.pts.reduce((a,b)=>a+(b||0),0);
 const rows=Q.map((q,i)=>{const c=S.picks[i],ok=c===q.a;
  return`<tr><td>${i+1}</td><td>${esc(q.q)}</td><td>${c==null?'(no answer)':esc(q.o[c])}</td><td>${esc(q.o[q.a])}</td><td class="${ok?'ok':'no'}">${ok?'Right':'Wrong'}</td></tr>`}).join('');
 st.innerHTML=`<div class="card" style="max-width:820px"><h1>Game over!</h1><div class="bigscore">${tot} / ${Q.length*PTS}</div><p>Well played, ${esc(S.name)}!</p>
 <div class="tbw"><table><tr><th>#</th><th>Question</th><th>Your choice</th><th>Correct</th><th></th></tr>${rows}</table></div>
 <button class="btn" id="dl">Download my choices</button> <button class="btn" id="nw" style="background:var(--pk);color:#fff">New player</button></div>`;
 $('#dl').onclick=()=>{const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const L=[['Question','Question text','Your choice','Correct answer','Result','Points'].map(q).join(',')];
  Q.forEach((z,i)=>{const c=S.picks[i];L.push([i+1,z.q,c==null?'(no answer)':z.o[c],z.o[z.a],c===z.a?'Right':'Wrong',S.pts[i]||0].map(q).join(','))});
  L.push(['','','','','TOTAL',tot].map(q).join(','));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+L.join('\n')],{type:'text/csv'}));
  a.download='quiz-results-'+S.name.replace(/\W+/g,'_')+'.csv';a.click()};
 $('#nw').onclick=intro;
}

const GAMES={};

/* ---------- Q1-2: stickman archery ---------- */
GAMES.bow=(box,q,qi)=>{
 const N=innerWidth<700,W=N?560:900,H=N?520:480,c=mkCanvas(box,W,H),x=c.getContext('2d');
 const SX=N?70:100,SY=H-85,P=(N?[[440,90],[300,210],[450,330],[310,440]]:[[740,80],[590,190],[760,300],[610,410]]).sort(()=>Math.random()-.5);
 const T=q.o.map((l,i)=>({l,i,x:P[i][0],y:P[i][1],w:N?190:170,h:N?52:46}));
 let m={x:500,y:200},ar=null,hit=-1,over=false;
 const aim=()=>{const dx=m.x-SX,dy=m.y-SY,p=Math.min(Math.hypot(dx,dy),260)/260;return{a:Math.atan2(dy,dx),v:7+11*p}};
 c.onpointermove=c.onpointerdown=e=>{m=pt(e,c)};
 c.onpointerup=e=>{m=pt(e,c);if(ar||over)return;const{a,v}=aim();ar={x:SX+Math.cos(a)*30,y:SY-5+Math.sin(a)*30,vx:Math.cos(a)*v,vy:Math.sin(a)*v}};
 return loop(dt=>{const k=dt*60;
  if(ar&&!over){ar.x+=ar.vx*k;ar.y+=ar.vy*k;ar.vy+=.22*k;
   const t=T.find(t=>Math.abs(ar.x-t.x)<t.w/2&&Math.abs(ar.y-t.y)<t.h/2);
   if(t){hit=t.i;over=true;ar.vx=ar.vy=0;setTimeout(()=>done(t.i,qi),900)}
   else if(ar.x>W+30||ar.x<-20||ar.y>H-25)ar=null}
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5b3df0');g.addColorStop(1,'#ff9ed0');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='#3ef2b0';x.fillRect(0,H-25,W,25);
  T.forEach(t=>{rr(x,t.x-t.w/2,t.y-t.h/2,t.w,t.h,14,hit===t.i?'#ffd23f':'#fff7e6','#000');
   x.fillStyle='#ff4f9a';x.beginPath();x.arc(t.x-t.w/2+22,t.y,13,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(t.x-t.w/2+22,t.y,6,0,7);x.fill();
   tx(x,t.l,t.x+14,t.y,N?20:17,'#1b1240','center',t.w-56)});
  const{a,v}=aim();
  if(!ar&&!over){let X=SX+Math.cos(a)*30,Y=SY-5+Math.sin(a)*30,vx=Math.cos(a)*v,vy=Math.sin(a)*v;
   for(let i=0;i<70;i++){X+=vx;Y+=vy;vy+=.22;if(i%3===0){x.fillStyle='#fff';x.globalAlpha=1-i/80;x.beginPath();x.arc(X,Y,3,0,7);x.fill()}if(Y>H-25)break}x.globalAlpha=1}
  x.strokeStyle='#000';x.lineWidth=5;x.lineCap='round';
  x.beginPath();x.arc(SX,SY-60,16,0,7);x.fillStyle='#ffd23f';x.fill();x.stroke();
  x.beginPath();x.moveTo(SX,SY-44);x.lineTo(SX,SY+25);x.moveTo(SX,SY+25);x.lineTo(SX-18,SY+60);x.moveTo(SX,SY+25);x.lineTo(SX+18,SY+60);
  x.moveTo(SX,SY-30);x.lineTo(SX+Math.cos(a)*30,SY-5+Math.sin(a)*30);x.stroke();
  x.save();x.translate(SX+Math.cos(a)*30,SY-5+Math.sin(a)*30);x.rotate(a);x.strokeStyle='#ff4f9a';x.lineWidth=5;
  x.beginPath();x.arc(0,0,34,-1.2,1.2);x.stroke();x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.moveTo(34*Math.cos(1.2)-(ar?0:12),34*Math.sin(1.2));x.lineTo(34*Math.cos(1.2)-(ar?0:12),-34*Math.sin(1.2));x.stroke();x.restore();
  if(ar){const d=Math.atan2(ar.vy,ar.vx)||0;x.save();x.translate(ar.x,ar.y);x.rotate(over?0:d);x.strokeStyle='#000';x.lineWidth=4;x.beginPath();x.moveTo(-28,0);x.lineTo(0,0);x.stroke();
   x.fillStyle='#ff4f9a';x.beginPath();x.moveTo(8,0);x.lineTo(-4,-6);x.lineTo(-4,6);x.fill();x.restore()}
 });
};

/* ---------- Q3-4: space shooter + boss ---------- */
GAMES.space=(box,q,qi)=>{
 const c=mkCanvas(box,480,640),x=c.getContext('2d');c.style.maxWidth='480px';
 let p={x:240,y:540,hp:3,inv:0},tg={x:240,y:540},B=[],A=[],E=[],F=[],kills=0,ph='fight',cd=0,sp=0,ac=0,ally=null,boss={hp:100,line:''},keys={};
 const stars=Array.from({length:50},()=>({x:Math.random()*480,y:Math.random()*640,s:.3+Math.random()}));
 const GOAL=10;
 c.onpointermove=c.onpointerdown=e=>{tg=pt(e,c);if(e.pointerType==='touch')tg.y-=70};
 const kd=e=>{keys[e.key]=1},ku=e=>{keys[e.key]=0};
 addEventListener('keydown',kd);addEventListener('keyup',ku);
 const ship=(X,Y,col)=>{x.fillStyle=col;x.strokeStyle='#000';x.lineWidth=2;x.beginPath();x.moveTo(X,Y-20);x.lineTo(X+16,Y+16);x.lineTo(X,Y+8);x.lineTo(X-16,Y+16);x.closePath();x.fill();x.stroke()};
 const off=loop((dt,t)=>{
  const sp_=320*dt;if(keys.ArrowLeft||keys.a)tg.x-=sp_;if(keys.ArrowRight||keys.d)tg.x+=sp_;if(keys.ArrowUp||keys.w)tg.y-=sp_;if(keys.ArrowDown||keys.s)tg.y+=sp_;
  tg.x=Math.max(20,Math.min(460,tg.x));tg.y=Math.max(60,Math.min(610,tg.y));
  p.x+=(tg.x-p.x)*Math.min(1,dt*10);p.y+=(tg.y-p.y)*Math.min(1,dt*10);p.inv-=dt;
  stars.forEach(s=>{s.y+=s.s*90*dt;if(s.y>640){s.y=0;s.x=Math.random()*480}});
  cd-=dt;if(cd<=0&&ph!=='end'){B.push({x:p.x,y:p.y-24});cd=.22}
  B.forEach(b=>b.y-=560*dt);
  if(ph==='fight'){sp-=dt;if(sp<=0){E.push({x:40+Math.random()*400,y:-20,vy:70+Math.random()*60+kills*6,r:Math.random()*6,hp:2});sp=.75}
   E.forEach(e=>{e.y+=e.vy*dt;e.x+=Math.sin(e.r+=dt*2)*50*dt;
    B.forEach(b=>{if(!b.d&&Math.hypot(b.x-e.x,b.y-e.y)<24){b.d=1;e.hp--;if(e.hp<=0){e.dead=1;kills++}}});
    if(!e.dead&&Math.hypot(p.x-e.x,p.y-e.y)<28){e.dead=1;if(p.inv<=0){p.hp--;p.inv=1.2;if(p.hp<=0){p.hp=3;kills=Math.max(0,kills-3)}}}});
   E=E.filter(e=>!e.dead&&e.y<670);
   if(kills>=GOAL){ph='pick';E=[];F=q.o.map((l,i)=>({i,l,x:68+i*115,y:190}))}}
  if(ph==='pick'){F.forEach(f=>f.yy=f.y+Math.sin(t*2+f.i)*14);
   const f=F.find(f=>Math.abs(p.x-f.x)<62&&Math.abs(p.y-f.yy)<38);
   if(f){ally={i:f.i,l:f.l,x:p.x+55,y:p.y};ph='boss';F=[]}}
  if(ph==='boss'||ph==='end'){
   if(ph==='boss'){ally.x+=(p.x+55-ally.x)*Math.min(1,dt*8);ally.y+=(p.y+10-ally.y)*Math.min(1,dt*8);
    ac-=dt;if(ac<=0){A.push({x:ally.x,y:ally.y-20});ac=.18}A.forEach(b=>b.y-=560*dt);
    boss.hp-=dt*100/8;B.forEach(b=>{if(b.y<170&&Math.abs(b.x-240)<80){b.d=1;boss.hp-=.6}});
    if(boss.hp<=0){boss.hp=0;ph='end';const ok=ally.i===q.a;boss.line=ok?'Thou shalt endure.':'Thou shalt endure no more';setTimeout(()=>done(ally.i,qi),2300)}}}
  A=A.filter(b=>b.y>150);B=B.filter(b=>!b.d&&b.y>-10);
  /* draw */
  x.fillStyle='#0d0726';x.fillRect(0,0,480,640);x.fillStyle='#fff';stars.forEach(s=>x.fillRect(s.x,s.y,s.s*2,s.s*2));
  x.fillStyle='#ffd23f';B.forEach(b=>x.fillRect(b.x-2,b.y-8,4,14));x.fillStyle='#3ef2b0';A.forEach(b=>x.fillRect(b.x-2,b.y-8,4,14));
  E.forEach(e=>{x.fillStyle='#ff4f9a';x.strokeStyle='#000';x.lineWidth=2;x.beginPath();x.ellipse(e.x,e.y+4,22,10,0,0,7);x.fill();x.stroke();x.fillStyle='#8ff';x.beginPath();x.arc(e.x,e.y-2,10,Math.PI,0);x.fill();x.stroke()});
  F.forEach(f=>{ship(f.x,f.yy-34,'#3ef2b0');rr(x,f.x-54,f.yy-12,108,44,12,'#fff7e6','#000');tx(x,f.l,f.x,f.yy+10,15,'#1b1240','center',96)});
  if(ph==='pick')tx(x,'Fly into your answer!',240,610,18,'#ffd23f');
  if(ph!=='end'&&!(p.inv>0&&Math.floor(t*12)%2))ship(p.x,p.y,'#4fc3ff');
  if(ally&&ph!=='end'){ship(ally.x,ally.y,'#3ef2b0');tx(x,ally.l,ally.x,ally.y+32,13,'#fff','center',100)}
  if(ph==='fight'){tx(x,'\u2665'.repeat(p.hp),20,24,22,'#ff5b5b','left');tx(x,`Invaders ${kills}/${GOAL}`,460,24,16,'#ffd23f','right')}
  if(ph==='boss'||ph==='end'){const dead=ph==='end',bx=240,by=100+Math.sin(t*3)*(dead?0:6);
   x.fillStyle=dead?'#555':'#8a4fff';x.strokeStyle='#000';x.lineWidth=4;x.beginPath();x.arc(bx,by,62,0,7);x.fill();x.stroke();
   x.fillStyle='#fff';[-24,24].forEach(d=>{x.beginPath();x.arc(bx+d,by-8,14,0,7);x.fill();x.stroke()});
   if(dead){tx(x,'x   x',bx,by-8,22,'#000')}else{x.fillStyle='#000';[-24,24].forEach(d=>{x.beginPath();x.arc(bx+d+(p.x-240)/30,by-6,6,0,7);x.fill()})}
   x.beginPath();x.moveTo(bx-30,by+26);for(let i=0;i<7;i++)x.lineTo(bx-30+i*10+5,by+(i%2?26:40));x.lineTo(bx+30,by+26);x.fillStyle='#fff';x.fill();x.stroke();
   rr(x,60,14,360,18,9,'#000');rr(x,62,16,Math.max(0,356*boss.hp/100),14,7,'#ff4f9a');tx(x,'BOSS',240,23,12,'#fff');
   if(dead){rr(x,50,196,380,56,16,'#fff7e6','#000');tx(x,boss.line,240,224,24,'#1b1240','center',360)}}
 });
 return()=>{off();removeEventListener('keydown',kd);removeEventListener('keyup',ku)};
};

/* ---------- Q5-6: candlestick trader ---------- */
GAMES.trade=(box,q,qi)=>{
 const N=innerWidth<700,W=N?600:900,c=mkCanvas(box,W,380),x=c.getContext('2d'),ch=document.createElement('div'),lk=document.createElement('button');
 ch.className='opts six';lk.className='btn go';lk.textContent='Lock in trade';box.append(ch,lk);
 let sel=-1,mode='idle',C=[],price=100,t=0,tk=0,shown=25,lo=90,hi=110;
 const add=(dr,vol)=>{const o=price,cl=o+dr+(Math.random()-.5)*vol;C.push({o,c:cl,h:Math.max(o,cl)+Math.random()*vol*.5,l:Math.min(o,cl)-Math.random()*vol*.5});price=cl;if(C.length>45)C.shift()};
 for(let i=0;i<45;i++)add(0,6);
 q.o.forEach((o,i)=>{const b=document.createElement('button');b.className='btn opt';b.textContent=o;
  b.onclick=()=>{if(mode!=='idle')return;sel=i;[...ch.children].forEach((e,j)=>e.classList.toggle('on',j===i))};ch.append(b)});
 lk.onclick=()=>{if(sel<0||mode!=='idle')return;mode=sel===q.a?'pump':'dump';t=0;lk.disabled=true;ch.style.pointerEvents='none'};
 return loop(dt=>{tk+=dt;
  if(mode==='idle'){if(tk>.35){tk=0;add(0,7)}}
  else{t+=dt;if(tk>.12){tk=0;mode==='pump'?add(9,6):add(-11,8)}
   shown+=((mode==='pump'?PTS:0)-shown)*Math.min(1,dt*3);
   if(t>3.2&&mode!=='end'){const m=mode;mode='end';setTimeout(()=>done(sel,qi),200)}}
  const L=Math.min(...C.map(k=>k.l)),H=Math.max(...C.map(k=>k.h));lo+=(L-lo)*Math.min(1,dt*6);hi+=(H-hi)*Math.min(1,dt*6);
  const Y=v=>350-(v-lo)/(hi-lo||1)*320;
  x.fillStyle='#120a30';x.fillRect(0,0,W,380);x.strokeStyle='#ffffff18';x.lineWidth=1;
  for(let i=1;i<6;i++){x.beginPath();x.moveTo(0,i*63);x.lineTo(W,i*63);x.stroke()}
  C.forEach((k,i)=>{const X=20+i*(W-40)/45,up=k.c>=k.o;x.strokeStyle=x.fillStyle=up?'#3ef2b0':'#ff5b5b';x.lineWidth=2;
   x.beginPath();x.moveTo(X,Y(k.h));x.lineTo(X,Y(k.l));x.stroke();x.fillRect(X-(N?4:6),Math.min(Y(k.o),Y(k.c)),N?8:12,Math.max(2,Math.abs(Y(k.o)-Y(k.c))))});
  tx(x,`Stake: ${Math.round(shown)} pts`,20,26,N?26:24,'#ffd23f','left');
  tx(x,mode==='pump'?'TO THE MOON!':mode==='dump'||mode==='end'&&shown<50?'CRASH...':sel<0?'Pick a coin':'Ready? Lock it in',W-20,26,22,mode==='pump'?'#3ef2b0':mode==='dump'?'#ff5b5b':'#fff','right');
 });
};

/* ---------- Q7-10: incremental tycoon with rebirth ---------- */
GAMES.tycoon=(box,q,qi)=>{
 const GOAL=[1000,3000,8000,20000][qi-6];
 const U=[{n:'Lemonade stand',b:15,r:1},{n:'Food truck',b:100,r:8},{n:'Cafe',b:650,r:50},{n:'Factory',b:4000,r:300}];
 const s=S.tyc||{m:0,g:[0,0,0,0]};S.tyc=s;
 const cost=i=>Math.ceil(U[i].b*1.15**s.g[i]),rate=()=>U.reduce((a,u,i)=>a+s.g[i]*u.r,0)*S.mult;
 box.innerHTML=`<div class="card tyc"><div class="money">$<span id="m">0</span></div><div id="inf" class="hint"></div>
  <div class="bar"><i id="pb"></i></div><div class="hint">Goal: $${fmt(GOAL)}</div>
  <button class="btn" id="ck"></button><div class="ups"></div><button class="btn go" id="rb" hidden>REBIRTH!</button></div>`;
 const ups=box.querySelector('.ups'),btn=U.map((u,i)=>{const b=document.createElement('button');b.className='btn';b.onclick=()=>{const c=cost(i);if(s.m>=c){s.m-=c;s.g[i]++}};ups.append(b);return b});
 $('#ck').onclick=()=>{s.m+=S.mult};
 $('#rb').onclick=()=>{if(locked||paused)return;paused=true;
  const md=document.createElement('div');md.className='modal';
  md.innerHTML=`<span class="tag">Rebirth question</span><h2>${esc(q.q)}</h2><p class="hint">Right = x4 multiplier. Wrong = x2.</p><div class="opts"></div>`;
  q.o.forEach((o,i)=>{const b=document.createElement('button');b.className='btn opt';b.textContent=o;b.onclick=()=>{paused=false;done(i,qi)};md.lastChild.append(b)});
  box.append(md)};
 return loop(dt=>{if(!locked&&!paused)s.m+=rate()*dt;
  $('#m').textContent=fmt(s.m);$('#inf').textContent=`+$${fmt(rate())}/sec  \u2022  multiplier x${S.mult}`;
  $('#ck').textContent=`Brew! +$${fmt(S.mult)}`;$('#pb').style.width=Math.min(100,s.m/GOAL*100)+'%';
  U.forEach((u,i)=>{const c=cost(i);btn[i].disabled=s.m<c;btn[i].textContent=`${u.n} (${s.g[i]}) \u2014 $${fmt(c)} \u2022 +${fmt(u.r*S.mult)}/s`});
  $('#rb').hidden=s.m<GOAL});
};
